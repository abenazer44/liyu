<link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  /* Palette from Habesha cloth: shemma cotton, maroon, ochre gold, green */
  :root { --ink:#2a1d17; --muted:#76665a; --line:#e6dccb; --bg:#f8f3ea; --card:#fffdf9; --tile:#efe7d9; --wa:#14804a;
          --accent:#8c1d2c; --gold:#b08327; --gold-line:rgba(176,131,39,.35); --herobg:#f3e9d6; --foot:#2a1d17; --foot-ink:#f3ece0; --foot-muted:#bfb2a3; }
  html[data-theme="dark"] { --ink:#efe6d8; --muted:#a8998a; --line:#33291f; --bg:#0f0b08; --card:#18120d; --tile:#1f1812; --wa:#1a9a5a;
          --accent:#e2b65c; --gold:#d6a94e; --gold-line:rgba(214,169,78,.35); --herobg:#16100b; --foot:#0a0705; --foot-ink:#e9e1d4; --foot-muted:#9c8f81; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Source Serif 4", Georgia, serif; font-size:16px; }
  .am, html[data-lang="am"] body { font-family:"Abyssinica SIL", "Nyala", serif; }
  html[data-lang="am"] body { font-size:17px; }
  .en { font-family:"Source Serif 4", Georgia, serif; }
  .l2 { display:block; font-size:.78em; color:var(--muted); font-weight:400; margin-top:1px; }
  a { color:inherit; }
  .wrap { max-width:1140px; margin:0 auto; padding:0 20px; }

  /* top bar */
  .nav { border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:10; }
  .navin { display:flex; justify-content:space-between; align-items:center; gap:12px; height:70px; }
  .logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
  .logo img { width:48px; height:48px; border-radius:50%; display:block; }
  .logo b { display:block; font-family:"Abyssinica SIL","Nyala",serif; font-size:23px; line-height:1.1; }
  .logo span { display:block; font-size:13.5px; color:var(--muted); }
  .ctrl { display:flex; gap:4px; align-items:center; font-size:14px; }
  .ctrl button { background:none; border:1px solid transparent; font:inherit; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:3px; }
  .ctrl button.on { color:var(--ink); border-color:var(--line); background:var(--card); }
  .ctrl #theme { font-size:17px; line-height:1; margin-left:6px; }

  /* header */
  .hero { display:grid; grid-template-columns:1.05fr 1fr; gap:36px; align-items:center; padding:46px 0 50px; }
  .hero h1 { font-family:"Abyssinica SIL","Nyala",serif; font-size:46px; line-height:1.15; color:var(--accent); font-weight:700; }
  .hero h1 .l2 { font-family:"Source Serif 4",Georgia,serif; font-size:.5em; color:var(--muted); margin-top:6px; }
  html[data-lang="en"] .hero h1 { font-family:"Source Serif 4",Georgia,serif; font-size:44px; }
  .hero p { margin-top:14px; color:var(--muted); font-size:18px; line-height:1.55; max-width:480px; }
  .hero .btns { margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .cta { background:var(--wa); color:#fff; text-decoration:none; padding:12px 20px; border-radius:4px; font-size:16px; }
  .cta .l2 { color:#e3f3ea; }
  .ghost { color:var(--ink); text-decoration:none; padding:12px 6px; border-bottom:1px solid var(--ink); font-size:16px; }
  .trio { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .trio img { width:100%; aspect-ratio:9/20; object-fit:cover; object-position:top; border-radius:10px; display:block; box-shadow:0 10px 24px rgba(42,29,23,.16); }
  .trio img:nth-child(2) { transform:translateY(-18px); }

  /* collections */
  h2 { font-size:24px; font-weight:700; padding:30px 0 14px; color:var(--accent); }
  h2 .l2 { font-size:.65em; }
  .cols { display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
  .col { cursor:pointer; background:none; border:0; text-align:left; font:inherit; color:inherit; }
  .col .pic { aspect-ratio:4/5; background:var(--tile); overflow:hidden; border-radius:6px; outline:3px solid transparent; outline-offset:2px; display:flex; align-items:center; justify-content:center; }
  .col .pic.logo-tile { background:#fff; }
  .col.on .pic { outline-color:var(--accent); }
  .col .pic img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .col .pic.logo-tile img { width:84%; height:auto; object-fit:contain; }
  .col .cn { margin-top:8px; font-size:15.5px; font-weight:700; line-height:1.25; }
  .col .cc { font-size:13px; color:var(--muted); margin-top:2px; }

  .bar { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:30px 0 10px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .cats { display:flex; gap:20px; overflow-x:auto; scrollbar-width:none; }
  .cats button { background:none; border:0; font:inherit; font-size:16.5px; color:var(--muted); cursor:pointer; padding:0 0 6px; border-bottom:3px solid transparent; white-space:nowrap; text-align:left; }
  .cats button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .cats button .n { font-size:12.5px; margin-left:4px; }
  .search { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 10px; font:inherit; font-size:15px; width:240px; border-radius:4px; margin-bottom:8px; }

  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:28px 18px; padding:20px 0 40px; }
  .item img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top; display:block; background:var(--tile); border-radius:6px; }
  .item.swatch img { object-position:center; }
  .item .nm { margin-top:9px; font-size:17px; font-weight:700; }
  .item .sub { color:var(--muted); font-size:14.5px; margin-top:2px; }
  .item .order { display:inline-block; margin-top:9px; background:var(--wa); color:#fff; text-decoration:none; font-size:14.5px; padding:7px 12px; border-radius:4px; }
  .item .order .l2 { color:#e3f3ea; }
  .empty { grid-column:1/-1; color:var(--muted); padding:20px 0 40px; line-height:1.6; }
  .empty a { color:var(--accent); }

  .footer { background:var(--foot); color:var(--foot-ink); }
  .footer .l2 { color:var(--foot-muted); }
  .foot { padding:30px 0 24px; display:grid; grid-template-columns:1.4fr 1fr .8fr 1fr; gap:24px; font-size:15px; line-height:1.65; }
  .foot h3 { font-size:15px; font-weight:700; margin-bottom:6px; color:#e0a94a; }
  .foot p { color:var(--foot-muted); }
  .foot a { text-decoration:none; border-bottom:1px solid var(--foot-muted); }
  .note { border-top:1px solid rgba(255,255,255,.12); padding:12px 0 84px; font-size:13px; color:var(--foot-muted); }
  .wa-float { position:fixed; right:16px; bottom:16px; width:56px; height:56px; border-radius:50%; background:#25d366; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:20; }
  .wa-float svg { width:30px; height:30px; fill:#fff; }


  /* Gold tibeb: Kokob (stepped diamond) and Meskel (cross) motifs, coloured by --gold via CSS masks */
  :root { --band:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2240%22 viewBox=%220 0 64 40%22%3E%3Crect y=%221%22 width=%2264%22 height=%222%22/%3E%3Crect y=%226%22 width=%2264%22 height=%221%22/%3E%3Crect y=%2233%22 width=%2264%22 height=%221%22/%3E%3Crect y=%2237%22 width=%2264%22 height=%222%22/%3E%3Cpath d=%22M32 9 L43 20 L32 31 L21 20 Z M32 12.5 L39.5 20 L32 27.5 L24.5 20 Z%22 fill-rule=%22evenodd%22/%3E%3Cpath d=%22M32 16 L36 20 L32 24 L28 20 Z%22/%3E%3Cpath d=%22M-1.5 13h3v5.5h5.5v3h-5.5v5.5h-3v-5.5h-5.5v-3h5.5z%22/%3E%3Cpath d=%22M62.5 13h3v5.5h5.5v3h-5.5v5.5h-3v-5.5h-5.5v-3h5.5z%22/%3E%3Ccircle cx=%2214%22 cy=%2220%22 r=%221.6%22/%3E%3Ccircle cx=%2250%22 cy=%2220%22 r=%221.6%22/%3E%3Cpath d=%22M8 10 L11 7 L14 10 Z M50 10 L53 7 L56 10 Z M8 30 L11 33 L14 30 Z M50 30 L53 33 L56 30 Z%22/%3E%3C/svg%3E"); --lattice:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 60 60%22%3E%3Cpath d=%22M28.5 21h3v7.5h7.5v3h-7.5v7.5h-3v-7.5h-7.5v-3h7.5z%22/%3E%3Cpath d=%22M0 -6 L6 0 L0 6 L-6 0 Z M60 -6 L66 0 L60 6 L54 0 Z M0 54 L6 60 L0 66 L-6 60 Z M60 54 L66 60 L60 66 L54 60 Z%22/%3E%3Ccircle cx=%2230%22 cy=%220%22 r=%221.2%22/%3E%3Ccircle cx=%220%22 cy=%2230%22 r=%221.2%22/%3E%3Ccircle cx=%2260%22 cy=%2230%22 r=%221.2%22/%3E%3Ccircle cx=%2230%22 cy=%2260%22 r=%221.2%22/%3E%3C/svg%3E"); --cross:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2220%22 height=%2220%22 viewBox=%220 0 20 20%22%3E%3Cpath d=%22M10 0 L20 10 L10 20 L0 10 Z M10 3.5 L16.5 10 L10 16.5 L3.5 10 Z%22 fill-rule=%22evenodd%22/%3E%3Cpath d=%22M8.8 5.5h2.4v3.3h3.3v2.4h-3.3v3.3h-2.4v-3.3h-3.3v-2.4h3.3z%22/%3E%3C/svg%3E"); }
  body { position:relative; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:var(--gold); opacity:.07;
    -webkit-mask:var(--lattice) repeat; mask:var(--lattice) repeat; pointer-events:none; }
  html[data-theme="dark"] body::before { opacity:.09; }
  .tibeb { height:40px; background:var(--gold); -webkit-mask:var(--band) repeat-x center; mask:var(--band) repeat-x center; }
  .herobg { position:relative; background:var(--herobg); overflow:hidden; }
  .herobg::before { content:""; position:absolute; inset:0; background:var(--gold); opacity:.16;
    -webkit-mask:var(--lattice) repeat; mask:var(--lattice) repeat; }
  .herobg > * { position:relative; }
  h2::before { content:""; display:inline-block; width:20px; height:20px; vertical-align:-3px; margin-right:10px; background:var(--gold); -webkit-mask:var(--cross) no-repeat center; mask:var(--cross) no-repeat center; }
  .nav { border-bottom-color:var(--gold-line); }
  .col .pic, .item img { box-shadow:0 0 0 1px var(--gold-line); }
  .ghost { border-bottom-color:var(--gold); }
  .footer { background:var(--foot); }

  @media (max-width:760px) {
    .navin { height:62px; } .logo img { width:40px; height:40px; } .logo b { font-size:20px; } .logo span { display:none; }
    .ctrl { font-size:13px; gap:0; } .ctrl button { padding:4px 5px; }
    .hero { grid-template-columns:1fr; gap:26px; padding:26px 0 30px; }
    .hero h1 { font-size:34px; } html[data-lang="en"] .hero h1 { font-size:32px; }
    .trio { gap:10px; } .trio img:nth-child(2) { transform:translateY(-10px); }
    .cols { display:flex; overflow-x:auto; scrollbar-width:none; gap:12px; margin-right:-20px; padding:3px 20px 3px 3px; }
    .col { flex:0 0 118px; }
    .grid { grid-template-columns:repeat(2,1fr); gap:24px 12px; }
    .search { width:100%; } .foot { grid-template-columns:1fr; }
  }
</style>

  if (p.cat === 'tibeb') return {...p, am:T.am.kemis+p.no, en:T.en.kemis+p.no, subKey:'kemisSub'};
  if (p.cat === 'chiffon') return {...p, am:T.am.chiffon+p.no, en:T.en.chiffon+p.no, subKey:'chiffonSub', key:String(p.no), swatch:true};
  const pre = p.cat === 'beshti' ? ['ጉቺ በሽቲ','Gucci Beshti'] : ['ቀሚስ','Dress'];
  return {...p, am:pre[0]+' · '+p.am, en:pre[1]+' · '+p.en, subKey:'dressSub'};
});
let lang = 'am', theme = 'light', cat = 'all', q = '';

// One string in the current language; in "both" mode Amharic on top, English underneath.
function tx(am, en) {
  if (lang === 'am') return `<span class="am">${am}</span>`;
  if (lang === 'en') return `<span class="en">${en}</span>`;
  return `<span class="am">${am}</span><span class="l2 en">${en}</span>`;
}
const k = key => tx(T.am[key], T.en[key]);

function render() {
  const H = document.documentElement;
  H.dataset.lang = lang; H.dataset.theme = theme; H.lang = lang === 'en' ? 'en' : 'am';
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = k(e.dataset.t));
  document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.getElementById('theme').textContent = theme === 'light' ? '☾' : '☀';
  document.getElementById('q').placeholder = lang === 'both' ? 'ፈልግ / Search (346)' : T[lang].search;

  const count = c => ITEMS.filter(i => i.cat === c).length;
  const itemsWord = lang === 'en' ? T.en.items : T.am.items;
  document.getElementById('cols').innerHTML = COLS.map(([key,am,en,img,tg,isLogo]) => `
    <button class="col ${cat===key?'on':''}" data-c="${key}">
      <div class="pic ${isLogo?'logo-tile':''}"><img src="img/${img}" alt="" loading="lazy"></div>
      <div class="cn">${tx(am,en)}</div>
      <div class="cc">${count(key) ? count(key)+' '+itemsWord : (lang==='en'?T.en.onTg:T.am.onTg)}</div>
    </button>`).join('');

  const tabs = [['all',T.am.all,T.en.all], ...COLS.map(c => [c[0],c[1],c[2]])];
  document.getElementById('cats').innerHTML = tabs.map(([key,am,en]) => {
    const n = key === 'all' ? ITEMS.length : count(key);
    return `<button data-c="${key}" class="${cat===key?'on':''}">${tx(am,en)}${n && lang!=='both' ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');

  const list = ITEMS.filter(i => (cat==='all' || i.cat===cat) && (i.am+' '+i.en+' '+(i.key||'')).toLowerCase().includes(q));
  const col = COLS.find(c => c[0] === cat);
  let html;
  if (list.length) {
    html = list.map(i => {
      const name = lang === 'en' ? i.en : i.am;
      const msg = (lang === 'en' ? T.en.msg : T.am.msg) + name;
      return `<div class="item ${i.swatch?'swatch':''}">
        <img src="img/${i.img}" alt="${name}" loading="lazy">
        <div class="nm">${tx(i.am,i.en)}</div><div class="sub">${k(i.subKey)}</div>
        <a class="order" href="https://wa.me/971543484316?text=${encodeURIComponent(msg)}">${k('order')}</a>
      </div>`;
    }).join('');
  } else if (col && !q) {
    html = `<p class="empty">${k('emptyTg')}<br><a href="https://t.me/${col[4]}">${k('openTg')} · t.me/${col[4]}</a></p>`;
  } else {
    html = `<p class="empty">${k('empty')}</p>`;
  }
  document.getElementById('grid').innerHTML = html;
  const tg = [['Liyu_Design','ልዩ ዲዛይን','Liyu Design'],['Liyu_chiffon','ሽፎን','Chiffon'],['Liyu_Menfesawi','መንፈሳዊ','Spiritual'],
              ['Liyu_oromia_bihereseb','ብሄረሰብ','Bihereseb'],['Liyu_Baltina_Coffee7','ባልትና + ቡና','Baltina + Coffee']];
  document.getElementById('tglinks').innerHTML = tg.map(([u,am,en]) => `<a href="https://t.me/${u}">${lang==='en'?en:am}</a>`).join('<br>');
}

document.querySelector('.ctrl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'theme') theme = theme === 'light' ? 'dark' : 'light'; else if (b.dataset.l) lang = b.dataset.l;
  render();
});
const pick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = cat === b.dataset.c && b.classList.contains('col') ? 'all' : b.dataset.c; render(); } };
document.getElementById('cols').addEventListener('click', pick);
document.getElementById('cats').addEventListener('click', pick);
document.getElementById('q').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
// #en, #both, #dark, #en-dark ... preselect a version
location.hash.slice(1).split('-').forEach(p => { if (T[p] || p === 'both') lang = p; if (p === 'dark') theme = 'dark'; });
render();
</script>
</body>
</html>
