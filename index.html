<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="ልዩ ዲዛይን · Liyu Design">
<meta property="og:description" content="Sample online shop for Liyu Design">
<meta property="og:image" content="https://abenazer44.github.io/liyu/img/p0_1_c.jpg">
<title>ልዩ ዲዛይን · Liyu Design</title>
<link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Palette from Habesha cloth: shemma cotton, maroon, ochre gold, green */
  :root { --ink:#2a1d17; --muted:#76665a; --line:#e3d8c6; --bg:#f7f1e6; --tile:#ece3d4; --wa:#14804a;
          --accent:#8c1d2c; --band:#8c1d2c; --band-ink:#f7f1e6; --band-muted:#e9c8cc; --foot:#1f4d36; --foot-ink:#eef3ec; --foot-muted:#b9cfc1; }
  html[data-theme="dark"] { --ink:#efe6d8; --muted:#a8998a; --line:#33291f; --bg:#17120f; --tile:#241c16; --wa:#1a9a5a;
          --accent:#d9a441; --band:#3d0f17; --band-ink:#efe6d8; --band-muted:#c7a5aa; --foot:#0f2a1d; --foot-ink:#e6ede8; --foot-muted:#9db7a7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Source Serif 4", Georgia, serif; font-size:16px; }
  .am, html[data-lang="am"] body { font-family:"Abyssinica SIL", "Nyala", serif; }
  html[data-lang="am"] body { font-size:17px; }
  .en { font-family:"Source Serif 4", Georgia, serif; }
  .l2 { display:block; font-size:.78em; color:var(--muted); font-weight:400; margin-top:1px; }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 20px; }
  .tibeb { height:10px; background:repeating-linear-gradient(90deg,#2a1d17 0 12px,#d9a441 12px 15px,#1f6b45 15px 27px,#d9a441 27px 30px,#a3242e 30px 42px,#d9a441 42px 45px); }
  .band { background:var(--band); color:var(--band-ink); }
  .band .l2 { color:var(--band-muted); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; font-size:14px; color:var(--band-muted); flex-wrap:wrap; }
  .ctrl { display:flex; gap:14px; align-items:center; }
  .ctrl button { background:none; border:0; font:inherit; color:var(--band-muted); cursor:pointer; padding:2px 3px; }
  .ctrl button.on { color:var(--band-ink); text-decoration:underline; text-underline-offset:4px; }
  .ctrl .sep { opacity:.5; }
  .head { padding:14px 0 26px; }
  .name { font-size:40px; font-weight:600; line-height:1.15; }
  .tag { margin-top:8px; font-size:19px; color:#e8b85a; }
  .desc { margin-top:10px; max-width:660px; color:var(--band-muted); line-height:1.55; }
  .contact { margin-top:14px; font-size:15px; line-height:1.6; }
  .contact a { text-decoration:none; border-bottom:1px solid var(--band-ink); }
  h2 { font-size:22px; font-weight:600; padding:24px 0 12px; color:var(--accent); }
  .cols { display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
  .col { cursor:pointer; background:none; border:0; text-align:left; font:inherit; color:inherit; }
  .col .pic { aspect-ratio:4/5; background:var(--tile); overflow:hidden; display:flex; align-items:center; justify-content:center; outline:3px solid transparent; outline-offset:2px; }
  .col.on .pic { outline-color:var(--accent); }
  .col .pic img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .col .pic .ph { font-family:"Abyssinica SIL","Nyala",serif; font-size:26px; color:#f7f1e6; text-align:center; padding:8px; }
  .col .cn { margin-top:7px; font-size:15.5px; font-weight:600; line-height:1.25; }
  .col .cc { font-size:13px; color:var(--muted); margin-top:2px; }
  .bar { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding:26px 0 10px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .cats { display:flex; gap:20px; overflow-x:auto; scrollbar-width:none; }
  .cats button { background:none; border:0; font:inherit; font-size:16.5px; color:var(--muted); cursor:pointer; padding:0 0 6px; border-bottom:3px solid transparent; white-space:nowrap; text-align:left; }
  .cats button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .cats button .n { font-size:12.5px; margin-left:4px; }
  .search { border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:8px 10px; font:inherit; font-size:15px; width:240px; border-radius:3px; margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:28px 18px; padding:18px 0 34px; }
  .item img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--tile); }
  .item.dress img { object-position:top; }
  .item .nm { margin-top:8px; font-size:17px; font-weight:600; }
  .item .sub { color:var(--muted); font-size:14.5px; margin-top:2px; }
  .item .order { display:inline-block; margin-top:8px; background:var(--wa); color:#fff; text-decoration:none; font-size:14.5px; padding:7px 12px; border-radius:3px; }
  .item .order .l2 { color:#e3f3ea; }
  .empty { grid-column:1/-1; color:var(--muted); padding:20px 0 40px; line-height:1.6; }
  .empty a { color:var(--accent); }
  .footer { background:var(--foot); color:var(--foot-ink); }
  .footer .l2 { color:var(--foot-muted); }
  .foot { padding:26px 0 24px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; font-size:15px; line-height:1.65; }
  .foot h3 { font-size:15px; font-weight:600; margin-bottom:4px; color:#e8b85a; }
  .foot a { text-decoration:none; border-bottom:1px solid var(--foot-muted); }
  .note { border-top:1px solid rgba(255,255,255,.15); padding:12px 0 80px; font-size:13px; color:var(--foot-muted); }
  .wa-float { position:fixed; right:16px; bottom:16px; width:54px; height:54px; border-radius:50%; background:#25d366; display:flex; align-items:center; justify-content:center; }
  .wa-float svg { width:30px; height:30px; fill:#fff; }
  @media (max-width:760px) {
    .name { font-size:32px; }
    .cols { display:flex; overflow-x:auto; scrollbar-width:none; gap:12px; margin-right:-20px; padding:3px 20px 3px 3px; }
    .col { flex:0 0 118px; }
    .grid { grid-template-columns:repeat(2,1fr); gap:22px 12px; }
    .search { width:100%; } .foot { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="top">
    <span data-t="loc"></span>
    <span class="ctrl">
      <span><button data-l="am" class="am">አማርኛ</button> <span class="sep">|</span> <button data-l="en" class="en">English</button> <span class="sep">|</span> <button data-l="both"><span class="am">አማርኛ</span> + <span class="en">English</span></button></span>
      <button id="theme"></button>
    </span>
  </div>

  <div class="head">
    <div class="name" data-t="name"></div>
    <div class="tag" data-t="tag"></div>
    <p class="desc" data-t="desc"></p>
    <div class="contact"><span data-t="orderline"></span> <a href="https://wa.me/971543484316">054 348 4316</a> · <a href="https://wa.me/971543808946">054 380 8946</a></div>
  </div>
</div></header>
<div class="tibeb"></div>
<div class="wrap">

  <h2 data-t="collH"></h2>
  <div class="cols" id="cols"></div>

  <div class="bar">
    <div class="cats" id="cats"></div>
    <input class="search" id="q">
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="tibeb"></div>
<footer class="footer"><div class="wrap">
  <div class="foot">
    <div><h3 data-t="addrH"></h3><span data-t="addr"></span><br><a href="https://maps.app.goo.gl/Tey6KQ9eMenKBVwo9" data-t="map"></a></div>
    <div><h3>WhatsApp</h3>054 348 4316<br>054 380 8946</div>
    <div><h3 data-t="tgH"></h3><span id="tglinks"></span></div>
  </div>
  <div class="note" data-t="note"></div>
</div></footer>

<a class="wa-float" href="https://wa.me/971543484316" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.06c-.24.69-1.420 1.32-1.96 1.36-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.92-4.66-4.1-.13-.18-1.11-1.48-1.11-2.83s.7-2 .96-2.28c.25-.27.55-.34.73-.34h.52c.17 0 .4-.06.62.48.24.56.8 1.94.87 2.08.07.14.12.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.69-.8.87-1.08.18-.27.36-.23.61-.14.25.09 1.6.75 1.870.89.27.14.46.2.52.32.07.11.07.66-.17 1.35z"/></svg></a>

<script>
const T = {
  am: {
    loc:'ሻርጃ · ዱባይ', name:'ልዩ ዲዛይን', tag:'ጥራት + ፍጥነት + ዋጋ = ልዩ አስብሎናል።',
    desc:'በሽሮሜዳ፣ መርካቶ፣ ቦሌና ጨርቆስ ተመስግነናል፤ አሁን ከዱባይ/ሻርጃ አለምአቀፍ ሆነናል። የሚወዱትን ይምረጡ፣ WhatsAppን ይጫኑ፣ ያዘዙት ቤቶ ድረስ ይመጣል።',
    orderline:'ለማዘዝ በWhatsApp:', collH:'በስብስብ ይግዙ', all:'ሁሉም', search:'ፈልግ (ለምሳሌ 346)',
    order:'በWhatsApp እዘዝ', msg:'ሰላም፣ ይህን ማዘዝ እፈልጋለሁ: ', chiffonName:'ሽፎን ቁ. ', chiffonSub:'የቱርክ / የህንድ ሽፎን · 3 ቀለሞች',
    dressSub:'ረጅም ቀሚስ', items:'እቃዎች', onTg:'በቴሌግራም',
    emptyTg:'የዚህ ስብስብ ፎቶዎች በቴሌግራም ቻናላችን ላይ ይገኛሉ።', openTg:'ቴሌግራም ይክፈቱ', empty:'ምንም አልተገኘም።',
    addrH:'አድራሻ', addr:'ሻርጃ፣ አል ያርሙክ ስትሪት፣ አልማሪፋ ት/ቤት ፊት ለፊት (ቤ/ክ አቅራቢያ)', map:'በካርታ ይመልከቱ',
    tgH:'የቴሌግራም ቻናሎቻችን', dark:'ጨለማ', light:'ብሩህ',
    note:'ይህ ለልዩ ዲዛይን የተዘጋጀ ናሙና ዲዛይን ነው። ገና አልተለቀቀም። ፎቶዎቹ ከቴሌግራም ቻናላችሁ የተወሰዱ ናቸው።'
  },
  en: {
    loc:'Sharjah · Dubai', name:'Liyu Design', tag:'Quality + speed + price. That is why they call us Liyu.',
    desc:'Loved in Shiromeda, Merkato, Bole and Cherkos, and now in Dubai and Sharjah. Choose what you like, message us on WhatsApp, and your order comes to your door.',
    orderline:'Order on WhatsApp:', collH:'Shop by collection', all:'All', search:'Search (e.g. 346)',
    order:'Order on WhatsApp', msg:'Hi, I would like to order: ', chiffonName:'Chiffon No. ', chiffonSub:'Turkish / Indian chiffon · 3 colours',
    dressSub:'Long dress', items:'items', onTg:'On Telegram',
    emptyTg:'Photos for this collection are on our Telegram channel.', openTg:'Open Telegram', empty:'Nothing found.',
    addrH:'Address', addr:'Al Yarmouk Street, Sharjah, opposite Al Marifa School (near the church)', map:'Open in Google Maps',
    tgH:'Our Telegram channels', dark:'Dark', light:'Light',
    note:'Sample design prepared for Liyu Design. Not live yet. Photos are from your Telegram channel.'
  }
};
// Collections: [key, amharic, english, cover image or null, telegram channel]
const COLS = [
  ['beshti','ጉቺ በሽቲ','Gucci Beshti','p0_1_c','Liyu_Design'],
  ['dress','ቀሚስ','Dresses','p1_0_c','Liyu_Design'],
  ['chiffon','ሽፎን','Chiffon','p3_7','Liyu_chiffon'],
  ['tibeb','ጥበብ','Tibeb',null,'Liyu_Design','#a8781f'],
  ['bihereseb','ብሄረሰብ አልባስ','Bihereseb',null,'Liyu_oromia_bihereseb','#1f6b45'],
  ['menfesawi','መንፈሳዊ','Spiritual',null,'Liyu_Menfesawi','#2c3e6b'],
  ['baltina','ባልትና + ቡና','Baltina + Coffee',null,'Liyu_Baltina_Coffee7','#5b3a24']
];
const DRESSES = [
  ['p0_0_c','beshti','ጉቺ በሽቲ · ቡናማ','Gucci Beshti · Brown'],['p0_1_c','beshti','ጉቺ በሽቲ · ሰማያዊ','Gucci Beshti · Blue'],
  ['p0_2_c','beshti','ጉቺ በሽቲ · ቀይ','Gucci Beshti · Red'],['p0_3_c','beshti','ጉቺ በሽቲ · ቢጫ','Gucci Beshti · Yellow'],
  ['p1_0_c','dress','ቀሚስ · ግራጫ አበባ','Dress · Grey floral'],['p1_1_c','dress','ቀሚስ · ሮዝ','Dress · Pink'],
  ['p1_2_c','dress','ቀሚስ · አረንጓዴ','Dress · Green'],['p2_0_c','dress','ቀሚስ · አረንጓዴ ቅጠል','Dress · Green leaf'],
  ['p2_1_c','dress','ቀሚስ · ፈዛዛ ወይን ጠጅ','Dress · Lilac'],['p2_2_c','dress','ቀሚስ · ወይን ጠጅ','Dress · Purple']
];
const NUMS = [346,340,333,353,334,347,344,338,336,335];
const ITEMS = [
  ...DRESSES.map(([img,cat,am,en]) => ({img, cat, am, en, subKey:'dressSub', dress:true})),
  ...NUMS.map((n,i) => ({img:'p3_'+i, cat:'chiffon', am:T.am.chiffonName+n, en:T.en.chiffonName+n, subKey:'chiffonSub', key:String(n)}))
];
let lang = 'am', theme = 'light', cat = 'all', q = '';

// One string in the current language; in "both" mode Amharic on top, English underneath.
function tx(am, en) {
  if (lang === 'am') return `<span class="am">${am}</span>`;
  if (lang === 'en') return `<span class="en">${en}</span>`;
  return `<span class="am">${am}</span><span class="l2 en">${en}</span>`;
}
const k = key => tx(T.am[key], T.en[key]);

function render() {
  const H = document.documentElement;
  H.dataset.lang = lang; H.dataset.theme = theme; H.lang = lang === 'en' ? 'en' : 'am';
  document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = k(e.dataset.t));
  document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const tl = theme === 'light' ? 'dark' : 'light';
  document.getElementById('theme').innerHTML = lang === 'both' ? `${T.am[tl]} · ${T.en[tl]}` : T[lang][tl];
  document.getElementById('q').placeholder = lang === 'both' ? 'ፈልግ / Search (346)' : T[lang].search;

  const count = c => ITEMS.filter(i => i.cat === c).length;
  document.getElementById('cols').innerHTML = COLS.map(([key,am,en,img,tg,color]) => `
    <button class="col ${cat===key?'on':''}" data-c="${key}">
      <div class="pic" ${color ? `style="background:${color}"` : ''}>${img ? `<img src="img/${img}.jpg" alt="">` : `<div class="ph">${am}</div>`}</div>
      <div class="cn">${tx(am,en)}</div>
      <div class="cc">${img ? count(key)+' '+(lang==='en'?T.en.items:T.am.items) : (lang==='en'?T.en.onTg:T.am.onTg)}</div>
    </button>`).join('');

  const tabs = [['all',T.am.all,T.en.all], ...COLS.map(c => [c[0],c[1],c[2]])];
  document.getElementById('cats').innerHTML = tabs.map(([key,am,en]) => {
    const n = key === 'all' ? ITEMS.length : count(key);
    return `<button data-c="${key}" class="${cat===key?'on':''}">${tx(am,en)}${n && lang!=='both' ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');

  const list = ITEMS.filter(i => (cat==='all' || i.cat===cat) && (i.am+' '+i.en+' '+(i.key||'')).toLowerCase().includes(q));
  const col = COLS.find(c => c[0] === cat);
  let html;
  if (list.length) {
    html = list.map(i => {
      const name = lang === 'en' ? i.en : i.am;
      const msg = (lang === 'en' ? T.en.msg : T.am.msg) + name;
      return `<div class="item ${i.dress?'dress':''}">
        <img src="img/${i.img}.jpg" alt="${name}">
        <div class="nm">${tx(i.am,i.en)}</div><div class="sub">${k(i.subKey)}</div>
        <a class="order" href="https://wa.me/971543484316?text=${encodeURIComponent(msg)}">${k('order')}</a>
      </div>`;
    }).join('');
  } else if (col && !q) {
    html = `<p class="empty">${k('emptyTg')}<br><a href="https://t.me/${col[4]}">${k('openTg')} · t.me/${col[4]}</a></p>`;
  } else {
    html = `<p class="empty">${k('empty')}</p>`;
  }
  document.getElementById('grid').innerHTML = html;
  document.getElementById('tglinks').innerHTML = COLS.slice(2).map(c => `<a href="https://t.me/${c[4]}">${lang==='en'?c[2]:c[1]}</a>`).join(' · ');
}

document.querySelector('.ctrl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'theme') theme = theme === 'light' ? 'dark' : 'light'; else if (b.dataset.l) lang = b.dataset.l;
  render();
});
const pick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = cat === b.dataset.c && b.classList.contains('col') ? 'all' : b.dataset.c; render(); } };
document.getElementById('cols').addEventListener('click', pick);
document.getElementById('cats').addEventListener('click', pick);
document.getElementById('q').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
// #en, #both, #dark, #en-dark ... preselect a version
location.hash.slice(1).split('-').forEach(p => { if (T[p] || p === 'both') lang = p; if (p === 'dark') theme = 'dark'; });
render();
</script>
</body>
</html>
